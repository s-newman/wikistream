stages:
  - check
  - build
  - deploy

variables:
  # Disable shallow clones. We need the full git history (or at least, a lot of
  # git history) to generate the version string, because I haven't been tagging
  # releases very often so git may have to look pretty far back to find the
  # last tag.
  GIT_DEPTH: 0

check:lint:
  stage: check
  tags:
    - altoidtin
  image: rust:latest
  before_script:
    - rustup component add rustfmt clippy
    - apt-get update && apt-get install -y shellcheck
  script:
    - scripts/lint.sh

check:test:
  stage: check
  tags:
    - altoidtin
  image: rust:latest
  variables:
    POSTGRES_USER: ws-user
    POSTGRES_PASSWORD: gitlab-ci-password
    POSTGRES_DB: wikistream
    DATABASE_URL: "postgres://ws-user:gitlab-ci-password@db/wikistream"
  services:
    - name: postgres
      alias: db
  script:
    - scripts/test.sh

build-job:
  stage: build
  tags:
    - altoidtin
  image: rust:latest
  script:
    - scripts/build.sh --release

build:docker-app:
  stage: build
  tags:
    - altoidtin-vm
  script:
    - scripts/docker-build.sh ws-app app.Dockerfile
    - docker save --output ws-app.tar ws-app:latest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ws-app.tar

build:docker-cli:
  stage: build
  tags:
    - altoidtin-vm
  script:
    - scripts/docker-build.sh ws-sse-cli cli.Dockerfile
    - docker save --output ws-sse-cli.tar ws-sse-cli:latest
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ws-sse-cli.tar

deploy-job:
  stage: deploy
  tags:
    - altoidtin-vm
  environment: production
  needs:
    - build:docker-app
    - build:docker-cli
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY --username $CI_REGISTRY_USER --password-stdin
  script:
    - scripts/load-and-push-image.sh ws-app
    - scripts/load-and-push-image.sh ws-sse-cli
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
